 {% extends "base.html" %}
 {% load static %}

{% block title %}Home Page{% endblock title %}
{% block css %}
        <link rel="stylesheet" href="{% static 'posts/home.css' %}">
{% endblock css %}



{% block body %}

<main class="flex-fill">
        <div class="container my-5">
          <h2 class="mb-4 fw-bold">📚 Latest Blog Posts</h2>
      
          <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            {% for post in posts %}
            <div class="col">
              <div class="card h-100 shadow-sm">
                <img src="https://via.placeholder.com/400x200" class="card-img-top" alt="Post Image">
                <div class="card-body">
                  <h5 class="card-title">{{ post.title }}</h5>
                  <p class="card-text">{{ post.paragraph | truncatewords:20 }}</p>
                  <a href="{% url 'post' post.id %}" class="btn btn-outline-primary btn-sm">Read More</a>
                </div>
              </div>
            </div>
            {% endfor %}
          </div>
        </div>
      </main>
{% endblock body %}
